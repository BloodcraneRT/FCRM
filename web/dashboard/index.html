<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fin-terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 1100px; }
  h1 { font-size: 1.1rem; letter-spacing: .05em; text-transform: uppercase; opacity: .8; }
  section { margin-bottom: 2.5rem; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid rgba(128,128,128,.25); }
  th { opacity: .6; font-weight: 500; }
  .empty { opacity: .5; font-style: italic; }
  .conf-high { color: #2e7d32; } .conf-medium { color: #ef6c00; } .conf-low { color: #9e9e9e; }
  .status-ok { color: #2e7d32; } .status-degraded { color: #ef6c00; } .status-down { color: #c62828; }
  .sev-info { color: #9e9e9e; } .sev-warning { color: #ef6c00; } .sev-critical { color: #c62828; }
</style>
</head>
<body>
  <h1>fin-terminal — dashboard</h1>

  <section>
    <h2>Opportunity Ranking</h2>
    <table id="opportunities"><thead><tr><th>Symbol</th><th>Vertical</th><th>Score</th><th>Confidence</th><th>Why</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Sector Strength</h2>
    <table id="sectors"><thead><tr><th>Vertical</th><th>Strength</th><th>Breadth</th><th>1d</th><th>5d</th><th>1m</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Catalyst Timeline</h2>
    <table id="catalysts"><thead><tr><th>When</th><th>Symbol</th><th>Vertical</th><th>Title</th><th>Confidence</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Alerts (last 7 days)</h2>
    <table id="alerts"><thead><tr><th>When</th><th>Symbol</th><th>Type</th><th>Severity</th><th>Message</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Data Source Health</h2>
    <table id="health"><thead><tr><th>Source</th><th>Status</th><th>Latency (ms)</th><th>Rows</th><th>As of</th></tr></thead><tbody></tbody></table>
  </section>

<script>
async function load(path, renderer) {
  const tbody = document.querySelector(path.target + ' tbody');
  try {
    const res = await fetch(path.url);
    const rows = await res.json();
    tbody.innerHTML = (rows && rows.length) ? rows.map(renderer).join('') : '<tr><td class="empty" colspan="6">no data yet — run `terminal pull` and scoring</td></tr>';
  } catch (e) {
    tbody.innerHTML = '<tr><td class="empty" colspan="6">API unreachable — is cmd/api running?</td></tr>';
  }
}

load({url: '/api/v1/opportunities', target: '#opportunities'}, r =>
  `<tr><td>${r.symbol}</td><td>${r.vertical||''}</td><td>${(r.composite_score||0).toFixed(1)}</td><td class="conf-${r.confidence}">${r.confidence}</td><td>${r.explanation||''}</td></tr>`);

load({url: '/api/v1/sector-strength', target: '#sectors'}, r =>
  `<tr><td>${r.vertical}</td><td>${(r.strength_score||0).toFixed(1)}</td><td>${((r.breadth||0)*100).toFixed(0)}%</td><td>${r.momentum_1d}</td><td>${r.momentum_5d}</td><td>${r.momentum_1m}</td></tr>`);

load({url: '/api/v1/catalysts', target: '#catalysts'}, r =>
  `<tr><td>${(r.ts||'').replace('T',' ').slice(0,16)}</td><td>${r.symbol}</td><td>${r.vertical||''}</td><td>${r.title}</td><td>${r.confidence}</td></tr>`);

load({url: '/api/v1/alerts', target: '#alerts'}, r =>
  `<tr><td>${(r.ts||'').replace('T',' ').slice(0,16)}</td><td>${r.symbol}</td><td>${r.alert_type}</td><td class="sev-${r.severity}">${r.severity}</td><td>${r.message||''}</td></tr>`);

load({url: '/api/v1/source-health', target: '#health'}, r =>
  `<tr><td>${r.source}</td><td class="status-${r.status}">${r.status}</td><td>${r.latency_ms}</td><td>${r.rows_ingested}</td><td>${(r.ts||'').replace('T',' ').slice(0,16)}</td></tr>`);
</script>
</body>
</html>
